<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Le Week-end Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Same layout as Le Corps Drill: one centred flash card, score strip above, word list below */
:root {
  --bg: #f1eff6; --card: #fcfbfe; --ink: #221f33; --muted: #625d78; --line: #d5d1e2;
  --accent: #2b4fb3; --good: #2f7a4f; --bad: #b3352a; --soft: #e7e4f0;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #15131f; --card: #1e1b2b; --ink: #e8e5f2; --muted: #9c97b3; --line: #332f46;
  --accent: #8aa6ff; --good: #63c08a; --bad: #f07a6c; --soft: #262236; color-scheme: dark } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: var(--body); font-size: 16px; line-height: 1.5; padding: 0 16px; }
.wrap { max-width: 560px; margin: 0 auto; padding: 28px 0 48px; display: flex; flex-direction: column; gap: 20px; }

header { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 800; font-size: 2rem; margin: 0; letter-spacing: -0.02em; line-height: 1; }
h1 span { color: var(--accent); }
.sub { color: var(--muted); font-size: .9rem; margin: 4px 0 0; }
.stats { display: flex; gap: 18px; font-family: var(--mono); font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { display: block; font-size: 1.25rem; color: var(--ink); font-weight: 500; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px 24px; display: flex; flex-direction: column; gap: 18px; }
.label { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.label .dir { color: var(--accent); font-weight: 700; }
.prompt { font-family: var(--display); font-weight: 800; font-size: clamp(1.9rem, 8vw, 2.8rem); line-height: 1.05; margin: 0; text-wrap: balance; }

form { display: flex; gap: 8px; }
input[type=text] { flex: 1; min-width: 0; font: 500 1.2rem var(--body); padding: 12px 14px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); }
input[type=text]:focus { outline: none; border-color: var(--ink); }
input.ok { border-color: var(--good); }
input.no { border-color: var(--bad); }
button { font: 700 1rem var(--body); border-radius: 10px; border: 0; cursor: pointer; padding: 12px 18px; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.primary { background: var(--ink); color: var(--bg); }
.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 8px 12px; font-size: .85rem; }
.accents { display: flex; gap: 6px; flex-wrap: wrap; }
.accents button { background: var(--soft); color: var(--ink); padding: 6px 12px; font-size: 1rem; }
.row { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }

.feedback { min-height: 3.2em; border-radius: 10px; padding: 12px 14px; background: var(--soft); font-size: .98rem; }
.feedback.good { color: var(--good); }
.feedback.bad { color: var(--bad); }
.feedback .ans { color: var(--ink); font-weight: 700; }
.feedback.idle { color: var(--muted); }

.goal { display: flex; flex-direction: column; gap: 6px; }
.goal-head { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); }
.goal-head b { font-family: var(--mono); font-weight: 500; color: var(--ink); }
.tiles { display: grid; grid-template-columns: repeat(16, 1fr); gap: 4px; }
.tiles i { height: 10px; border-radius: 3px; background: var(--line); transition: background .3s; }
.tiles i.ok { background: var(--good); }

.win { border-radius: 10px; padding: 14px; background: var(--good); color: var(--card); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.win strong { font-family: var(--display); font-size: 1.3rem; }
.win button { background: var(--card); color: var(--ink); padding: 8px 14px; font-size: .9rem; }

details { border-top: 1px solid var(--line); padding-top: 12px; }
summary { cursor: pointer; color: var(--muted); font-size: .9rem; }
table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: .92rem; }
th { text-align: right; font: 500 .7rem var(--mono); color: var(--muted); padding: 4px; }
td { padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.n { font-family: var(--mono); font-size: .8rem; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--line); }
.pill.weak { background: var(--bad); } .pill.ok { background: var(--good); }

@media (prefers-reduced-motion: no-preference) {
  .pop { animation: pop .25s ease-out; }
  @keyframes pop { from { transform: translateY(6px); opacity: .4; } to { transform: none; opacity: 1; } }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Le <span>Week-end</span></h1>
      <p class="sub">8 words, French → English and English → French.</p>
    </div>
    <div class="stats">
      <div><b id="sScore">0/0</b>correct</div>
      <div><b id="sStreak">0</b>streak</div>
      <div><b id="sBest">0</b>best</div>
    </div>
  </header>

  <section class="card">
    <div class="goal">
      <div class="goal-head"><span>Cards right last time you saw them</span><b id="goalN">0/16</b></div>
      <div class="tiles" id="tiles"></div>
    </div>
    <div class="win" id="win" hidden>
      <strong>Toutes les 16 !</strong>
      <span style="display:flex;gap:6px"><button type="button" id="keep">Keep going</button><button type="button" id="again">Start again</button></span>
    </div>

    <div class="label"><span class="dir" id="dir"></span><span id="note"></span></div>
    <p class="prompt pop" id="prompt"></p>
    <form id="form" autocomplete="off">
      <input type="text" id="answer" spellcheck="false" autocapitalize="off" aria-label="Your answer">
      <button class="primary" id="go" type="submit">Check</button>
    </form>
    <div class="row">
      <div class="accents" id="accents" aria-label="Insert accented letter">
        <button type="button" data-ch="é">é</button>
        <button type="button" data-ch="è">è</button>
        <button type="button" data-ch="ê">ê</button>
        <button type="button" data-ch="à">à</button>
        <button type="button" data-ch="ô">ô</button>
        <button type="button" data-ch="î">î</button>
      </div>
      <div style="display:flex;gap:6px">
        <button type="button" class="ghost" id="hint">Hint</button>
        <button type="button" class="ghost" id="skip">Show answer</button>
      </div>
    </div>
    <div class="feedback idle" id="fb" aria-live="polite">Type your answer and press Enter. Every card keeps coming back; the ones you miss come back more often.</div>
    <details>
      <summary>Word list and your accuracy</summary>
      <table><thead><tr><td></td><td></td><th>FR→EN</th><th>EN→FR</th></tr></thead><tbody id="list"></tbody></table>
      <div style="margin-top:12px"><button type="button" class="ghost" id="reset">Reset progress</button></div>
    </details>
  </section>
</div>

<script>
// [French, English, accepted French answers, accepted English answers]
const WORDS = [
  ["un marché aux puces", "a flea market", ["un marché aux puces", "le marché aux puces"], ["flea market", "flea markets"]],
  ["une exposition", "an exhibition", ["une exposition", "l'exposition"], ["exhibition", "exhibit"]],
  ["une boîte", "a nightclub", ["une boîte", "la boîte", "une boîte de nuit", "la boîte de nuit"], ["nightclub", "night club", "club"]],
  ["un stade", "a stadium", ["un stade", "le stade"], ["stadium"]],
  ["l'argent (m)", "money", ["l'argent", "de l'argent"], ["money"]],
  ["faire un tour à vélo", "to go for a bike ride", ["faire un tour à vélo"], ["go for a bike ride", "go on a bike ride", "go for a bicycle ride", "go on a bicycle ride", "go for a ride on a bike", "go cycling", "go for a cycle"]],
  ["faire des achats", "to go shopping", ["faire des achats"], ["go shopping", "do shopping", "do the shopping", "do some shopping", "shop"]],
  ["ranger sa chambre", "to tidy one's bedroom", ["ranger sa chambre"], ["tidy one's bedroom", "tidy one's room", "tidy your bedroom", "tidy your room", "tidy my bedroom", "tidy my room", "tidy his bedroom", "tidy her bedroom", "tidy his room", "tidy her room", "tidy the bedroom", "tidy bedroom", "tidy room", "tidy up one's bedroom", "tidy up one's room", "tidy up your bedroom", "tidy up your room", "tidy up my bedroom", "tidy up my room"]]
];
// 16 cards: 0-7 French→English, 8-15 English→French
const CARDS = [...WORDS.map((_, i) => ({ w: i, toFr: false })), ...WORDS.map((_, i) => ({ w: i, toFr: true }))];

const $ = id => document.getElementById(id);
const KEY = "le-weekend-v2";
const fresh = () => ({ c: CARDS.map(() => ({ r: 0, t: 0, weight: 3, ok: false })), right: 0, total: 0, streak: 0, best: 0, won: false });
let st = fresh();
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.c && s.c.length === CARDS.length) st = s; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };

let cur = -1, last = -1, answered = false, hintLvl = 0, helped = false;

const norm = s => s.toLowerCase().replace(/[’‘`´]/g, "'").replace(/\s*'\s*/g, "'").replace(/[.!?,]/g, "").replace(/\s+/g, " ").trim();
const strip = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "");
const enCore = s => norm(s).replace(/^to /, "").replace(/^(a|an|the|some) /, "").replace(/ones /g, "one's ");
const frCore = s => norm(s).replace(/^(un |une |le |la |l'|de l')/, "");
const target = card => card.toFr ? WORDS[card.w][0].replace(" (m)", "") : WORDS[card.w][1];

function grade(card, raw) {
  const [fr, , frOk, enOk] = WORDS[card.w];
  if (card.toFr) {
    const got = norm(raw);
    if (frOk.includes(got)) return { ok: true, msg: "Correct!" };
    if (frOk.some(a => strip(a) === strip(got))) return { ok: true, msg: "Correct, but watch the accents:" };
    if (frOk.some(a => strip(frCore(a)) === strip(frCore(got))))
      return { ok: false, msg: /^(un|une|l')/.test(fr) ? "Right word, but the article is wrong or missing. It's" : "Nearly. It's" };
    return { ok: false, msg: "Not quite. It's" };
  }
  const got = enCore(raw);
  if (enOk.some(a => enCore(a) === got)) return { ok: true, msg: "Correct!" };
  return { ok: false, msg: "Not quite. It's" };
}

function pick() {
  const pool = st.c.map((c, i) => i === last ? 0 : c.weight);
  let r = Math.random() * pool.reduce((a, b) => a + b, 0);
  for (let i = 0; i < pool.length; i++) { r -= pool[i]; if (r <= 0) return i; }
  return 0;
}

function next() {
  last = cur; cur = pick(); answered = false; hintLvl = 0; helped = false;
  const card = CARDS[cur], [fr, en] = WORDS[card.w];
  $("dir").textContent = card.toFr ? "English → French" : "French → English";
  $("note").textContent = card.toFr && /^(un|une)/.test(fr) ? "include un / une" : "";
  const p = $("prompt"); p.textContent = card.toFr ? en : fr; p.classList.remove("pop"); void p.offsetWidth; p.classList.add("pop");
  $("accents").style.visibility = card.toFr ? "visible" : "hidden";
  const a = $("answer"); a.value = ""; a.className = ""; a.placeholder = card.toFr ? "en français…" : "in English…"; a.focus();
  $("go").textContent = "Check";
  $("fb").className = "feedback idle"; $("fb").textContent = "Your turn.";
}

function record(ok) {
  const c = st.c[cur]; c.t++; st.total++;
  if (ok) { c.r++; st.right++; st.streak++; st.best = Math.max(st.best, st.streak); c.weight = Math.max(1, c.weight - 1); c.ok = true; }
  else { st.streak = 0; c.weight = Math.min(10, c.weight + 3); c.ok = false; }
  const all = st.c.every(c => c.ok);
  if (all && !st.won) { st.won = true; $("win").hidden = false; }
  save(); render();
}

function check() {
  if (answered) return next();
  const raw = $("answer").value; if (!raw.trim()) return;
  const card = CARDS[cur], { ok, msg } = grade(card, raw);
  record(ok && !helped);
  answered = true; $("answer").className = ok ? "ok" : "no";
  const extra = ok && helped ? " (with a hint, so it doesn't count yet)" : "";
  $("fb").className = "feedback " + (ok ? "good" : "bad");
  $("fb").innerHTML = `${msg} <span class="ans">${target(card)}</span>${extra}<br><small style="color:var(--muted)">Press Enter for the next word.</small>`;
  $("go").textContent = "Next";
}

$("form").addEventListener("submit", e => { e.preventDefault(); check(); });
$("hint").onclick = () => {
  if (answered) return;
  const want = target(CARDS[cur]); hintLvl++; helped = true;
  const shown = want.split(" ").map((w, i) => i < hintLvl ? w : w[0] + "·".repeat(w.length - 1)).join(" ");
  $("fb").className = "feedback idle"; $("fb").innerHTML = `Hint: <span class="ans">${shown}</span>`;
  $("answer").focus();
};
$("skip").onclick = () => {
  if (answered) return next();
  record(false); answered = true; $("go").textContent = "Next";
  $("fb").className = "feedback bad"; $("fb").innerHTML = `The answer is <span class="ans">${target(CARDS[cur])}</span>. It'll come back soon.`;
  $("answer").focus();
};
document.querySelectorAll("[data-ch]").forEach(b => b.onclick = () => {
  const a = $("answer"), s = a.selectionStart ?? a.value.length, e = a.selectionEnd ?? a.value.length;
  a.value = a.value.slice(0, s) + b.dataset.ch + a.value.slice(e);
  a.focus(); a.setSelectionRange(s + 1, s + 1);
});
$("keep").onclick = () => { $("win").hidden = true; $("answer").focus(); };
const restart = () => { st = fresh(); save(); $("win").hidden = true; cur = last = -1; render(); next(); };
$("again").onclick = restart;
$("reset").onclick = restart;

function render() {
  $("sScore").textContent = `${st.right}/${st.total}`;
  $("sStreak").textContent = st.streak; $("sBest").textContent = st.best;
  $("tiles").innerHTML = st.c.map(c => `<i class="${c.ok ? "ok" : ""}"></i>`).join("");
  $("goalN").textContent = `${st.c.filter(c => c.ok).length}/16`;
  const cell = c => {
    const pct = c.t ? Math.round(100 * c.r / c.t) : null;
    const cls = pct === null ? "" : pct >= 75 ? "ok" : pct < 50 ? "weak" : "";
    return `<td class="n"><span class="pill ${cls}"></span>${c.r}/${c.t}</td>`;
  };
  $("list").innerHTML = WORDS.map(([fr, en], i) => `<tr><td>${fr}</td><td>${en}</td>${cell(st.c[i])}${cell(st.c[i + 8])}</tr>`).join("");
}

render(); next();
</script>
</body>
</html>
